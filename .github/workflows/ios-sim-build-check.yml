name: iOS Simulator Build Check

on:
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ios-sim-build-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios-sim-build:
    runs-on: macos-latest
    name: Build & verify on iOS 15.5 Simulator

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Rust toolchain (iOS simulator target)
        uses: dtolnay/rust-toolchain@stable
        with:
          # aarch64-apple-ios-sim  → Apple Silicon Mac 上的模拟器
          # x86_64-apple-ios       → Intel Mac 上的模拟器（兼容）
          targets: aarch64-apple-ios-sim,aarch64-apple-ios,x86_64-apple-ios

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend assets
        run: pnpm run web:build

      - name: Install iOS 15.5 simulator runtime
        # GitHub Actions macOS runner 只预装最新几个 runtime，需要手动下载 iOS 15.5
        run: |
          # 列出可用 runtime，供日志排查
          xcrun simctl list runtimes || true

          # 尝试下载 iOS 15.5 runtime（需要 Xcode 13.x 支持；runner 若已包含则跳过）
          xcodebuild -downloadPlatform iOS -buildVersion 15.5 2>/dev/null || \
          xcodebuild -downloadAllPlatforms 2>/dev/null || \
          echo "::warning ::iOS 15.5 runtime download skipped or unavailable on this runner; falling back to available runtime"

          # 再次列出，确认是否成功
          xcrun simctl list runtimes

      - name: Select best available iOS 15.x simulator
        id: select-sim
        run: |
          # 优先找 iOS 15.5，找不到则退而求其次用 iOS 15.x 任意版本
          RUNTIME=$(xcrun simctl list runtimes -j | \
            python3 -c "
          import sys, json
          runtimes = json.load(sys.stdin)['runtimes']
          candidates = [r for r in runtimes if r.get('isAvailable') and 'iOS' in r.get('name','') and r.get('version','').startswith('15')]
          preferred = [r for r in candidates if r.get('version','').startswith('15.5')]
          chosen = preferred[0] if preferred else (candidates[0] if candidates else None)
          if chosen:
              print(chosen['identifier'])
          " 2>/dev/null || echo "")

          if [ -z "$RUNTIME" ]; then
            echo "::warning ::No iOS 15.x runtime found; using latest available iOS runtime"
            RUNTIME=$(xcrun simctl list runtimes -j | \
              python3 -c "
          import sys, json
          runtimes = json.load(sys.stdin)['runtimes']
          ios = [r for r in runtimes if r.get('isAvailable') and 'iOS' in r.get('name','')]
          print(ios[-1]['identifier'] if ios else '')
          ")
          fi

          echo "runtime=$RUNTIME" >> "$GITHUB_OUTPUT"
          echo "Selected runtime: $RUNTIME"

      - name: Create simulator device
        id: create-sim
        run: |
          RUNTIME="${{ steps.select-sim.outputs.runtime }}"
          DEVICE_ID=$(xcrun simctl create "CI-iPhone-15.5" "iPhone 14" "$RUNTIME" 2>/dev/null || \
                      xcrun simctl create "CI-iPhone-15.5" "iPhone 13" "$RUNTIME")
          echo "device_id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
          echo "Created simulator device: $DEVICE_ID"

      - name: Resolve Xcode project path
        id: xcode-proj
        run: |
          PROJ="src-tauri/gen/apple/tauritavern.xcodeproj"
          if [ ! -d "$PROJ" ]; then
            echo "::error ::Xcode project not found at $PROJ"
            exit 1
          fi
          echo "proj=$PROJ" >> "$GITHUB_OUTPUT"

      - name: Build Rust static library for iOS simulator
        run: |
          # Tauri mobile 要求先构建 Rust 库，再让 Xcode 链接
          # 我们只做 build-check，用 debug 模式以加快速度
          cargo build \
            --manifest-path src-tauri/Cargo.toml \
            --target aarch64-apple-ios-sim \
            --lib \
            --features custom-protocol
        env:
          RUST_BACKTRACE: "1"

      - name: xcodebuild – compile for iOS 15.5 Simulator (build check)
        run: |
          DEVICE_ID="${{ steps.create-sim.outputs.device_id }}"
          xcodebuild \
            -project "${{ steps.xcode-proj.outputs.proj }}" \
            -scheme tauritavern_iOS \
            -destination "platform=iOS Simulator,id=${DEVICE_ID}" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=YES \
            build \
            | xcpretty || xcodebuild \
            -project "${{ steps.xcode-proj.outputs.proj }}" \
            -scheme tauritavern_iOS \
            -destination "platform=iOS Simulator,id=${DEVICE_ID}" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=YES \
            build
        env:
          RUST_BACKTRACE: "1"

      - name: Cleanup simulator device
        if: always()
        run: |
          DEVICE_ID="${{ steps.create-sim.outputs.device_id }}"
          if [ -n "$DEVICE_ID" ]; then
            xcrun simctl delete "$DEVICE_ID" || true
          fi
